<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>E-commerce Shoping — Admin Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#0b0f19;color:#fff}
body{display:flex;align-items:center;justify-content:center;padding:20px}.card{width:min(430px,100%);background:#151b2b;border:1px solid #2a3550;border-radius:20px;padding:28px;box-shadow:0 20px 60px #0008}
h1{margin:0 0 8px;font-size:26px}p{color:#9da8bf;margin:0 0 24px}label{display:block;font-size:14px;margin:14px 0 7px;color:#cbd4e6}
input{width:100%;padding:14px;border-radius:12px;border:1px solid #39455f;background:#0e1422;color:#fff;font-size:16px;outline:none}
button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:12px;background:#2563eb;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}.error{display:none;margin-top:14px;color:#ffb4b4;background:#3a171d;padding:10px 12px;border-radius:10px;font-size:14px}
.info{display:none;margin-top:14px;color:#a7f3d0;background:#063b2a;padding:10px 12px;border-radius:10px;font-size:14px}
#portal{display:none;position:fixed;inset:0;background:#0b0f19}#portal iframe{width:100%;height:100%;border:0}
.logout{position:fixed;z-index:20;right:14px;top:14px;padding:9px 12px;border-radius:10px;border:1px solid #45516d;background:#151b2b;color:#fff;cursor:pointer;display:none;width:auto;margin:0}
.small{font-size:12px;color:#77839c;margin-top:16px;text-align:center}
</style></head>
<body>
<div id="loginCard" class="card">
<h1>Admin Manager Login</h1>
<p>Sign in with the Supabase Auth account whose profile role is <b>admin</b> or <b>manager</b>.</p>
<form id="loginForm">
<label for="email">Admin Email</label>
<input id="email" type="email" autocomplete="username" placeholder="admin@example.com" required>
<label for="password">Password</label>
<input id="password" type="password" autocomplete="current-password" placeholder="Enter password" required>
<button id="loginBtn" type="submit">Login to Admin</button>
<div id="error" class="error"></div><div id="info" class="info"></div>
</form>
<div class="small">Authentication and permissions are handled by Supabase Auth + profiles.role.</div>
</div>
<div id="portal"><button id="logout" class="logout" type="button">Logout</button><iframe src="index.html?portal=admin" title="E-commerce Shoping Admin Management Portal"></iframe></div>
<script>
const SUPABASE_URL="https://eklycpnfnyjydrgxdnzm.supabase.co";
const SUPABASE_KEY="sb_publishable_NUt0MMWF-50fcrWCL5Nq-g_OX3FGqVf";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const portal=document.getElementById("portal"),card=document.getElementById("loginCard"),btn=document.getElementById("loginBtn"),error=document.getElementById("error"),info=document.getElementById("info");
function showPortal(){card.style.display="none";portal.style.display="block";document.getElementById("logout").style.display="block"}
function showLogin(){card.style.display="block";portal.style.display="none";document.getElementById("logout").style.display="none"}
async function verifyAdmin(session){
 if(!session?.user)return false;
 const {data,error}=await db.from("profiles").select("id,email,role,full_name").eq("id",session.user.id).maybeSingle();
 if(error) throw error;
 if(!data || !["admin","manager"].includes(data.role)){await db.auth.signOut();throw new Error("This account is not an admin/manager account.");}
 return true;
}
(async()=>{
 try{const {data}=await db.auth.getSession();if(data.session){await verifyAdmin(data.session);showPortal();}}
 catch(e){showLogin();error.textContent=e.message||"Admin verification failed.";error.style.display="block";}
})();
document.getElementById("loginForm").addEventListener("submit",async e=>{
 e.preventDefault();error.style.display="none";info.style.display="none";btn.disabled=true;btn.textContent="Signing in…";
 try{
  const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;
  const {data,error:authError}=await db.auth.signInWithPassword({email,password});if(authError)throw authError;
  await verifyAdmin(data.session);info.textContent="Admin authenticated. Loading dashboard…";info.style.display="block";showPortal();
 }catch(e){error.textContent=e.message||"Login failed.";error.style.display="block";}finally{btn.disabled=false;btn.textContent="Login to Admin";}
});
document.getElementById("logout").addEventListener("click",async()=>{await db.auth.signOut();showLogin();location.reload()});
db.auth.onAuthStateChange(async(_event,session)=>{if(session&&!portal.style.display){try{await verifyAdmin(session);showPortal()}catch{}}});
</script></body></html>
