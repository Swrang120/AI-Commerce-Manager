<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>E-commerce Shoping — Admin Login</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#0b0f19;color:#fff}
body{display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:min(420px,100%);background:#151b2b;border:1px solid #2a3550;border-radius:20px;padding:28px;box-shadow:0 20px 60px #0008}
h1{margin:0 0 8px;font-size:26px}p{color:#9da8bf;margin:0 0 24px}
label{display:block;font-size:14px;margin:14px 0 7px;color:#cbd4e6}
input{width:100%;padding:14px;border-radius:12px;border:1px solid #39455f;background:#0e1422;color:#fff;font-size:16px;outline:none}
button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:12px;background:#2563eb;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.error{display:none;margin-top:14px;color:#ff8b8b;background:#3a171d;padding:10px 12px;border-radius:10px;font-size:14px}
#portal{display:none;position:fixed;inset:0;background:#0b0f19}#portal iframe{width:100%;height:100%;border:0}
.logout{position:fixed;z-index:20;right:14px;top:14px;padding:9px 12px;border-radius:10px;border:1px solid #45516d;background:#151b2b;color:#fff;cursor:pointer;display:none;width:auto;margin:0}
.small{font-size:12px;color:#77839c;margin-top:16px;text-align:center}
</style>
</head>
<body>
<div id="loginCard" class="card">
<h1>Admin Manager Login</h1>
<p>Only authorized admin users can access the management panel.</p>
<form id="loginForm">
<label for="mobile">Mobile Number</label>
<input id="mobile" type="tel" inputmode="numeric" autocomplete="username" placeholder="Enter mobile number" required>
<label for="password">Password</label>
<input id="password" type="password" autocomplete="current-password" placeholder="Enter password" required>
<button type="submit">Login to Admin</button>
<div id="error" class="error">Invalid mobile number or password.</div>
</form>
<div class="small">Admin access only</div>
</div>
<div id="portal">
<button id="logout" class="logout" type="button">Logout</button>
<iframe src="index.html?portal=admin" title="E-commerce Shoping Admin Management Portal"></iframe>
</div>
<script>
const ADMIN_MOBILE="8099473948";
const ADMIN_PASSWORD="Swrang@123";
const SESSION_KEY="ecommerce_admin_session";
function showPortal(){document.getElementById("loginCard").style.display="none";document.getElementById("portal").style.display="block";document.getElementById("logout").style.display="block"}
function logout(){sessionStorage.removeItem(SESSION_KEY);location.reload()}
if(sessionStorage.getItem(SESSION_KEY)==="1")showPortal();
document.getElementById("loginForm").addEventListener("submit",function(e){
e.preventDefault();
const mobile=document.getElementById("mobile").value.replace(/\D/g,"");
const password=document.getElementById("password").value;
const error=document.getElementById("error");
if(mobile===ADMIN_MOBILE&&password===ADMIN_PASSWORD){sessionStorage.setItem(SESSION_KEY,"1");error.style.display="none";showPortal()}else{error.style.display="block"}
});
document.getElementById("logout").addEventListener("click",logout);
</script>
</body>
</html>
