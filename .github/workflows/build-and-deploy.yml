name: Deploy Website to GitHub Pages
# Website-only deployment. Android/APK build is disabled for now.

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:

  deploy-web:
    name: Deploy E-commerce Shoping Website to GitHub Pages
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare Web Distribution
        run: |
          mkdir -p _site
          cp index.html _site/
          cp manifest.json _site/
          cp customer.html automation.html admin.html _site/
          if [ -d "public" ]; then
            cp -r public _site/
          fi
          # Create .nojekyll so GitHub Pages does not ignore underscore files
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
